<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />

  <title>Pac-Man CR</title>

  <!--
    Importante para Capacitor / Android:
    permite resolver correctamente rutas y assets
    dentro de la aplicación instalada.
  -->
  <base href="./" />

  <meta
    name="viewport"
    content="
      viewport-fit=cover,
      width=device-width,
      initial-scale=1.0,
      minimum-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  />

  <meta
    name="format-detection"
    content="telephone=no"
  />

  <meta
    name="msapplication-tap-highlight"
    content="no"
  />

  <!-- Color principal de la aplicación -->
  <meta
    name="theme-color"
    content="#000000"
  />

  <!-- Aplicación móvil -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Pac-Man CR"
  />

  <!-- Icono -->
  <link
    rel="icon"
    type="image/png"
    href="assets/icon/favicon.png"
  />

</head>

<body>

  <!-- Aplicación Angular / Ionic -->
  <app-root></app-root>

</body>

</html>
