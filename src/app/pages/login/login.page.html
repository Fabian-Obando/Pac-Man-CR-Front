<ion-content
  [fullscreen]="true"
  class="login-page"
>

  <!-- =====================================================
       FONDO
  ====================================================== -->

  <div
    class="background"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       PERSONAJES
  ====================================================== -->

  <div
    class="characters"
    aria-hidden="true"
  >

    <div class="monster">
      😈
    </div>

    <div class="ghost red"></div>

    <div class="ghost pink"></div>

    <div class="ghost cyan"></div>

    <div class="ghost orange"></div>

  </div>


  <!-- =====================================================
       TARJETA
  ====================================================== -->

  <main class="login-card">


    <!-- ===================================================
         CABECERA
    ==================================================== -->

    <header class="login-header">

      <h1>
        PAC-MAN CR
      </h1>

      <h2>
        Multijugador Online
      </h2>

      <p class="authors">
        Fabián Obando • Steven Gutiérrez
      </p>

    </header>


    <!-- ===================================================
         ERROR
    ==================================================== -->

    <div
      class="error-message"
      *ngIf="mensajeError"
      role="alert"
    >

      <ion-icon
        name="alert-circle-outline"
      ></ion-icon>

      <span>
        {{ mensajeError }}
      </span>

    </div>


    <!-- ===================================================
         ÉXITO
    ==================================================== -->

    <div
      class="success-message"
      *ngIf="mensajeExito"
      role="status"
    >

      <ion-icon
        name="checkmark-circle-outline"
      ></ion-icon>

      <span>
        {{ mensajeExito }}
      </span>

    </div>


    <!-- ===================================================
         CORREO
    ==================================================== -->

    <ion-item
      lines="none"
      class="input-item"
    >

      <ion-icon
        slot="start"
        name="mail-outline"
      ></ion-icon>

      <ion-input
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="Correo electrónico"
        [(ngModel)]="correo"
        [disabled]="cargando"
        (keyup.enter)="alPresionarEnter()"
      >
      </ion-input>

    </ion-item>


    <!-- ===================================================
         CONTRASEÑA
    ==================================================== -->

    <ion-item
      lines="none"
      class="input-item password-item"
    >

      <ion-icon
        slot="start"
        name="lock-closed-outline"
      ></ion-icon>

      <ion-input
        [type]="
          mostrarPassword
            ? 'text'
            : 'password'
        "
        autocomplete="current-password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        [disabled]="cargando"
        (keyup.enter)="alPresionarEnter()"
      >
      </ion-input>


      <!-- MOSTRAR / OCULTAR -->

      <ion-button
        slot="end"
        fill="clear"
        type="button"
        class="btn-password"
        [disabled]="cargando"
        (click)="alternarPassword()"
      >

        <ion-icon
          slot="icon-only"
          [name]="
            mostrarPassword
              ? 'eye-off-outline'
              : 'eye-outline'
          "
        ></ion-icon>

      </ion-button>

    </ion-item>


    <!-- ===================================================
         RECUPERAR CONTRASEÑA

         Para jugadores normales se mantiene.

         Para la cuenta administrativa NO aparece.
    ==================================================== -->

    <div
      class="forgot-container"
      *ngIf="!esCorreoAdministradorActual()"
    >

      <ion-button
        type="button"
        fill="clear"
        size="small"
        class="forgot-link"
        [disabled]="cargando"
        (click)="irRecuperarContrasena()"
      >

        <ion-icon
          slot="start"
          name="key-outline"
        ></ion-icon>

        ¿Olvidaste tu contraseña?

      </ion-button>

    </div>


    <!-- ===================================================
         LOGIN
    ==================================================== -->

    <ion-button
      expand="block"
      type="button"
      class="btn-login"
      [disabled]="cargando"
      (click)="login()"
    >

      <ion-spinner
        *ngIf="cargando"
        name="crescent"
      ></ion-spinner>

      <ion-icon
        *ngIf="!cargando"
        slot="start"
        name="log-in-outline"
      ></ion-icon>

      <span *ngIf="!cargando">
        INICIAR SESIÓN
      </span>

      <span *ngIf="cargando">
        INICIANDO...
      </span>

    </ion-button>


    <!-- ===================================================
         SEPARADOR
    ==================================================== -->

    <div class="separator">

      <span></span>

      <small>
        O
      </small>

      <span></span>

    </div>


    <!-- ===================================================
         REGISTRO
    ==================================================== -->

    <ion-button
      fill="outline"
      expand="block"
      type="button"
      class="btn-register"
      [disabled]="cargando"
      (click)="irRegistro()"
    >

      <ion-icon
        slot="start"
        name="person-add-outline"
      ></ion-icon>

      CREAR CUENTA NUEVA

    </ion-button>


    <!-- ===================================================
         SEGURIDAD
    ==================================================== -->

    <div class="security-info">

      <ion-icon
        name="shield-checkmark-outline"
      ></ion-icon>

      <span>

        Tu cuenta está protegida por
        verificación de correo y recuperación
        segura de contraseña.

      </span>

    </div>


  </main>


  <!-- =====================================================
       PAC-MAN
  ====================================================== -->

  <div
    class="pacman"
    aria-hidden="true"
  ></div>

</ion-content>
