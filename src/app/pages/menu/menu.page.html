<ion-content
  [fullscreen]="true"
  class="menu-page"
>

  <!-- =====================================================
       FONDO PAC-MAN
  ====================================================== -->

  <div
    class="maze-background"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       CABECERA DEL JUGADOR
  ====================================================== -->

  <header class="menu-header">

    <!-- PERFIL -->

    <button
      type="button"
      class="profile"
      (click)="perfil()"
      aria-label="Abrir perfil"
    >

      <div class="avatar">

        <img
          *ngIf="fotoPerfil"
          [src]="fotoPerfil"
          [alt]="'Foto de perfil de ' + nombre"
        >

        <span
          *ngIf="!fotoPerfil"
          aria-hidden="true"
        >
          👤
        </span>

      </div>


      <div class="info">

        <h2>
          {{ nombre }}
        </h2>

        <span class="nivel">
          Nivel {{ nivel }}
        </span>

        <!-- BARRA DE EXPERIENCIA -->

        <div
          class="xp-bar"
          role="progressbar"
          [attr.aria-valuenow]="porcentajeXp"
          aria-valuemin="0"
          aria-valuemax="100"
        >

          <div
            class="xp-fill"
            [style.width.%]="porcentajeXp"
          ></div>

        </div>

        <small>
          {{ xpActual }} / {{ xpMaxima }} XP
        </small>

      </div>

    </button>


    <!-- ===================================================
         ORO Y ACTUALIZACIÓN
    ==================================================== -->

    <div class="header-actions">

      <!-- ORO DEL USUARIO -->

      <div
        class="coins"
        aria-label="Oro disponible"
      >

        <span aria-hidden="true">
          🪙
        </span>

        <strong>
          {{ monedas }}
        </strong>

      </div>


      <!-- ACTUALIZAR DATOS -->

      <button
        type="button"
        class="refresh-user"
        [disabled]="cargandoUsuario"
        (click)="actualizarDatos()"
        aria-label="Actualizar datos"
      >

        <ion-spinner
          *ngIf="cargandoUsuario"
          name="crescent"
        ></ion-spinner>

        <ion-icon
          *ngIf="!cargandoUsuario"
          name="refresh-outline"
        ></ion-icon>

      </button>

    </div>

  </header>


  <!-- =====================================================
       ERROR DE SINCRONIZACIÓN
  ====================================================== -->

  <div
    class="menu-error"
    *ngIf="mensajeError"
    role="alert"
  >

    <ion-icon
      name="cloud-offline-outline"
    ></ion-icon>

    <span>
      {{ mensajeError }}
    </span>

  </div>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main class="menu-main">


    <!-- ===================================================
         LOGO
    ==================================================== -->

    <section class="logo">

      <h1>
        PAC-MAN CR
      </h1>

      <h3>
        Multijugador Online
      </h3>

    </section>


    <!-- ===================================================
         PERSONAJES
    ==================================================== -->

    <section
      class="characters"
      aria-hidden="true"
    >

      <div class="ghost red">
        <div class="eyes">
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="ghost pink">
        <div class="eyes">
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="ghost cyan">
        <div class="eyes">
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="ghost orange">
        <div class="eyes">
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="monster">
        😈
      </div>

    </section>


    <!-- ===================================================
         JUGAR
    ==================================================== -->

    <ion-button
      expand="block"
      class="play-btn"
      [disabled]="!menuListo"
      (click)="jugar()"
    >

      <ion-icon
        slot="start"
        name="play-outline"
      ></ion-icon>

      JUGAR

    </ion-button>


    <!-- ===================================================
         OPCIONES
    ==================================================== -->

    <section class="menu-section">

      <div class="section-title">
        OPCIONES
      </div>


      <div class="menu-grid">


        <!-- AMIGOS -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="amigos()"
        >

          <span class="option-icon">
            👥
          </span>

          AMIGOS

        </ion-button>


        <!-- RANKING -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="ranking()"
        >

          <span class="option-icon">
            🏆
          </span>

          RANKING

        </ion-button>


        <!-- SKINS -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="skins()"
        >

          <span class="option-icon">
            🎨
          </span>

          SKINS

        </ion-button>


        <!-- CONFIGURACIÓN -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="configuracion()"
        >

          <span class="option-icon">
            ⚙️
          </span>

          CONFIG.

        </ion-button>


        <!-- PERFIL -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="perfil()"
        >

          <span class="option-icon">
            👤
          </span>

          PERFIL

        </ion-button>


        <!-- LISTA DE ESPERA -->

        <ion-button
          fill="outline"
          class="menu-option"
          (click)="listaEspera()"
        >

          <span class="option-icon">
            ⌛
          </span>

          ESPERA

        </ion-button>

      </div>

    </section>


    <!-- ===================================================
         INFORMACIÓN
    ==================================================== -->

    <section class="news">

      <div class="news-icon">
        🎮
      </div>


      <div>

        <h3>
          Pac-Man CR Online
        </h3>

        <p>
          Crea una sala o únete a una partida
          multijugador.
        </p>

      </div>

    </section>


    <!-- ===================================================
         PANEL ADMINISTRADOR
    ==================================================== -->

    <ion-button
      *ngIf="esAdministrador"
      expand="block"
      color="warning"
      class="admin"
      (click)="admin()"
    >

      <ion-icon
        slot="start"
        name="shield-checkmark-outline"
      ></ion-icon>

      PANEL ADMINISTRADOR

    </ion-button>


    <!-- ===================================================
         CERRAR SESIÓN
    ==================================================== -->

    <section class="session-section">

      <ion-button
        expand="block"
        fill="outline"
        color="danger"
        class="logout-btn"
        (click)="cerrarSesion()"
      >

        <ion-icon
          slot="start"
          name="log-out-outline"
        ></ion-icon>

        CERRAR SESIÓN

      </ion-button>

    </section>

  </main>


  <!-- =====================================================
       PAC-MAN ANIMADO INFERIOR
  ====================================================== -->

  <div
    class="pacman-run"
    aria-hidden="true"
  >

    <div class="pacman"></div>

    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</ion-content>
