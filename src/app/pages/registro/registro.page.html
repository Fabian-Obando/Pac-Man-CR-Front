<ion-content fullscreen class="registro-page">

  <!-- Fondo -->
  <div class="maze-background"></div>

  <!-- Personajes superiores -->

  <section class="top-characters">

    <div class="monster"></div>

    <div class="ghost red">
      <div class="eyes">
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="ghost pink">
      <div class="eyes">
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="ghost cyan">
      <div class="eyes">
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="ghost orange">
      <div class="eyes">
        <span></span>
        <span></span>
      </div>
    </div>

  </section>

  <!-- Tarjeta -->

  <div class="registro-card">

    <h1>PAC-MAN CR</h1>

    <h2>Crear cuenta</h2>

    <p class="subtitle">
      Crea tu perfil para jugar partidas online con tus amigos.
    </p>

    <!-- Usuario -->

    <ion-item
      lines="none"
      class="input-box">

      <ion-icon
        name="person-outline"
        slot="start">
      </ion-icon>

      <ion-input

        labelPlacement="floating"

        placeholder="Nombre de usuario"

        [(ngModel)]="nombreUsuario">

      </ion-input>

    </ion-item>

    <!-- Correo -->

    <ion-item
      lines="none"
      class="input-box">

      <ion-icon
        name="mail-outline"
        slot="start">
      </ion-icon>

      <ion-input

        type="email"

        labelPlacement="floating"

        placeholder="Correo electrónico"

        [(ngModel)]="correo">

      </ion-input>

    </ion-item>

    <!-- Contraseña -->

    <ion-item
      lines="none"
      class="input-box">

      <ion-icon
        name="lock-closed-outline"
        slot="start">
      </ion-icon>

      <ion-input

        [type]="mostrarPassword ? 'text' : 'password'"

        placeholder="Contraseña"

        [(ngModel)]="password">

      </ion-input>

      <ion-button

        fill="clear"

        slot="end"

        (click)="mostrarPassword=!mostrarPassword">

        <ion-icon

          [name]="mostrarPassword ? 'eye-off-outline':'eye-outline'">

        </ion-icon>

      </ion-button>

    </ion-item>

    <!-- Confirmar -->

    <ion-item
      lines="none"
      class="input-box">

      <ion-icon
        name="shield-checkmark-outline"
        slot="start">
      </ion-icon>

      <ion-input

        [type]="mostrarConfirmar ? 'text' : 'password'"

        placeholder="Confirmar contraseña"

        [(ngModel)]="confirmarPassword">

      </ion-input>

      <ion-button

        fill="clear"

        slot="end"

        (click)="mostrarConfirmar=!mostrarConfirmar">

        <ion-icon

          [name]="mostrarConfirmar ? 'eye-off-outline':'eye-outline'">

        </ion-icon>

      </ion-button>

    </ion-item>

    <!-- Error -->

    <div
      class="error-message"
      *ngIf="mensajeError">

      <ion-icon
        name="warning-outline">
      </ion-icon>

      {{ mensajeError }}

    </div>

    <!-- Crear -->

    <ion-button

      expand="block"

      class="btn-crear"

      [disabled]="cargando"

      (click)="crearCuenta()">

      <ion-spinner

        *ngIf="cargando"

        name="crescent">

      </ion-spinner>

      <span *ngIf="!cargando">

        CREAR CUENTA

      </span>

    </ion-button>

    <!-- Volver -->

    <ion-button

      expand="block"

      fill="clear"

      class="btn-volver"

      (click)="volverLogin()">

      ← VOLVER AL LOGIN

    </ion-button>

    <!-- Footer -->

    <div class="footer-info">

      Al registrarte aceptas los términos de uso de
      <strong>Pac-Man CR</strong>.

    </div>

  </div>

  <!-- Pac-Man inferior -->

  <div class="pacman-run">

    <div class="pacman"></div>

    <div class="dots">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>

</ion-content>
